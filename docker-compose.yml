name: sss

services:
  # ServerStatus server: 接收 agent 上报(35601), 生成 json/stats.json
  srv:
    image: "${SSS_SRV_IMAGE:-cppla/serverstatus@sha256:14e13d4d7f0f0cbaacc2dc58476ec85a67e7433a91329b33bfefda4bab5924e0}"
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config/config.json
      - ./json:/app/data
    ports:
      - "${SSS_REPORT_BIND:-0.0.0.0}:${SSS_REPORT_PORT:-35601}:35601"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 前端面板: 静态资源来自 Web 镜像，/json/stats.json 实时代理到 srv HTTP API
  web:
    image: "${SSS_WEB_IMAGE:-ghcr.io/lau0x/serverstatus-web@sha256:05a95c44a4138bb507c4947a6a9c3d83ae4b6fdd4ff8cde13546d954b3903f28}"
    restart: unless-stopped
    volumes:
      - ./service/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SSS_WEB_BIND:-0.0.0.0}:${SSS_WEB_PORT:-8081}:80"
    depends_on:
      - srv
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/json/stats.json"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Telegram 上下线通知
  bot:
    profiles:
      - telegram
    image: "${SSS_BOT_IMAGE:-ghcr.io/lau0x/serverstatus-bot@sha256:5602c74a1907e0ba464521f78b2df0dfafc885e619d591fd2734eb18aef17498}"
    restart: unless-stopped
    depends_on:
      - srv
    environment:
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      DEBOUNCE_POLLS: ${DEBOUNCE_POLLS:-10}
      POLL_INTERVAL: ${POLL_INTERVAL:-3}
      FEED_FAILURE_THRESHOLD: ${FEED_FAILURE_THRESHOLD:-3}
      FEED_LOG_INTERVAL: ${FEED_LOG_INTERVAL:-60}
      FEED_MAX_BACKOFF: ${FEED_MAX_BACKOFF:-30}
      NOTIFY_RETRY_BASE: ${NOTIFY_RETRY_BASE:-30}
      NOTIFY_RETRY_MAX: ${NOTIFY_RETRY_MAX:-300}
      HEARTBEAT_FILE: /tmp/serverstatus-bot-heartbeat
      HEARTBEAT_STALE_AFTER: ${HEARTBEAT_STALE_AFTER:-45}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p=os.environ['HEARTBEAT_FILE']; assert os.path.isfile(p) and time.time()-os.path.getmtime(p) <= float(os.environ['HEARTBEAT_STALE_AFTER'])"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
